<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* CS Stats Coach v3 – original "game menu" design. No game logos or art. */
:root {
  --bg: #07090c;
  --panel: rgba(20, 24, 31, 0.78);
  --panel-solid: #12161c;
  --line: rgba(255, 186, 92, 0.16);
  --text: #ece7da;
  --muted: #8f96a3;
  --orange: #ffad3b;
  --orange-2: #ff7a1a;
  --khaki: #c8b98a;
  --win: #4fd18b;
  --loss: #ff5a5f;
  --sky: #6ec3ff;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
body { overflow-x: hidden; }

/* animated background */
.bg {
  position: fixed; inset: 0; z-index: -1; overflow: hidden;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(255,122,26,0.18), transparent 60%),
    radial-gradient(900px 500px at -10% 30%, rgba(110,195,255,0.08), transparent 60%),
    var(--bg);
}
.bg::before {
  content: ""; position: absolute; inset: -50%;
  background-image:
    linear-gradient(rgba(200,185,138,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,185,138,0.05) 1px, transparent 1px);
  background-size: 48px 48px;
  transform: perspective(600px) rotateX(55deg);
  animation: gridmove 18s linear infinite;
}
@keyframes gridmove { to { background-position: 0 480px, 0 0; } }

.wrap { max-width: 1180px; margin: 0 auto; padding: 22px 18px 40px; }

/* ---------- HERO ---------- */
.hero {
  position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 26px; align-items: center;
  padding: 26px 28px; border-radius: 20px; overflow: hidden;
  background: linear-gradient(120deg, rgba(255,173,59,0.14), rgba(18,22,28,0.9) 45%), var(--panel-solid);
  border: 1px solid var(--line);
  box-shadow: 0 30px 80px -30px rgba(255,122,26,0.35);
  animation: rise .7s ease both;
}
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
}
.avatar {
  width: 104px; height: 104px; border-radius: 22px; object-fit: cover;
  border: 2px solid var(--orange); box-shadow: 0 0 0 6px rgba(255,173,59,0.12), 0 0 40px rgba(255,173,59,0.35);
  background: #1d232c; display: grid; place-items: center; font: 700 44px 'Chakra Petch'; color: var(--orange);
}
.kicker { font: 700 12px 'JetBrains Mono'; letter-spacing: .3em; color: var(--khaki); text-transform: uppercase; }
.name { font: 700 46px/1.05 'Chakra Petch'; letter-spacing: .02em; margin: 6px 0 10px; }
.name span { color: var(--orange); }
.elo-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.elo-bar { flex: 1; min-width: 200px; max-width: 420px; height: 10px; border-radius: 99px; background: rgba(255,255,255,0.07); overflow: hidden; }
.elo-bar i { display: block; height: 100%; width: 0; border-radius: inherit;
  background: linear-gradient(90deg, var(--orange-2), var(--orange)); box-shadow: 0 0 18px var(--orange);
  transition: width 1.6s cubic-bezier(.2,.8,.2,1); }
.elo-note { font: 500 13px 'JetBrains Mono'; color: var(--muted); }
.elo-note b { color: var(--orange); }

.level {
  position: relative; width: 120px; height: 120px; display: grid; place-items: center;
}
.level svg { position: absolute; inset: 0; animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.level .num { font: 700 54px 'Chakra Petch'; color: var(--lvl, var(--orange)); text-shadow: 0 0 24px var(--lvl, var(--orange)); }
.level .lbl { position: absolute; bottom: -6px; font: 700 10px 'JetBrains Mono'; letter-spacing: .3em; color: var(--muted); }

/* ---------- STAT CARDS ---------- */
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin: 18px 0; }
.stat {
  position: relative; padding: 16px 18px; border-radius: var(--radius); background: var(--panel);
  border: 1px solid var(--line); backdrop-filter: blur(6px); overflow: hidden;
  animation: rise .7s ease both; transition: transform .2s, border-color .2s;
}
.stat:hover { transform: translateY(-3px); border-color: rgba(255,173,59,0.5); }
.stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(var(--orange), transparent); }
.stat .t { font: 700 11px 'JetBrains Mono'; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; }
.stat .v { font: 700 34px 'Chakra Petch'; margin-top: 6px; }
.stat .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.stat .ico { position: absolute; right: 12px; top: 10px; font-size: 22px; opacity: .55; }

/* form strip */
.form { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
.form .t { font: 700 11px 'JetBrains Mono'; letter-spacing: .22em; color: var(--muted); }
.pip { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font: 700 13px 'Chakra Petch';
  animation: pop .4s ease both; }
.pip.w { background: rgba(79,209,139,0.15); color: var(--win); border: 1px solid rgba(79,209,139,0.5); }
.pip.l { background: rgba(255,90,95,0.12); color: var(--loss); border: 1px solid rgba(255,90,95,0.45); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.streak { font: 600 13px Inter; color: var(--khaki); margin-left: 6px; }

/* ---------- NAV ---------- */
nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; position: sticky; top: 0; z-index: 5;
  padding: 10px 0; background: linear-gradient(var(--bg) 70%, transparent); }
nav button {
  font: 700 13px 'Chakra Petch'; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; cursor: pointer;
  transition: all .2s;
}
nav button:hover { color: var(--text); border-color: rgba(255,173,59,0.5); }
nav button.on { color: #1a1206; background: linear-gradient(90deg, var(--orange), var(--orange-2)); border-color: transparent;
  box-shadow: 0 8px 26px -8px rgba(255,122,26,0.7); }

section { display: none; }
section.on { display: block; animation: rise .45s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

h2 { font: 700 24px 'Chakra Petch'; letter-spacing: .04em; margin: 4px 0 4px; }
h2 .q { color: var(--orange); }
.sub { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.chart { position: relative; height: 300px; }

/* ---------- BRIEFING ---------- */
.tips { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tip {
  display: flex; gap: 14px; align-items: flex-start; padding: 18px; border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(255,173,59,0.08), rgba(20,24,31,0.85) 50%); border: 1px solid var(--line);
  animation: rise .5s ease both; transition: transform .2s;
}
.tip:hover { transform: translateY(-3px); }
.tip .i { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 24px;
  background: rgba(255,173,59,0.12); border: 1px solid rgba(255,173,59,0.35); }
.tip p { line-height: 1.5; font-size: 15px; }
.tip b { color: var(--orange); }
.note { color: var(--muted); font-size: 12px; margin-top: 12px; }

/* ---------- MAP CARDS ---------- */
.maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.map {
  position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); padding: 16px;
  min-height: 170px; background: var(--panel-solid); transition: transform .25s, box-shadow .25s;
}
.map:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 18px 40px -18px var(--c1); }
.map .art { position: absolute; inset: 0; opacity: .5;
  background:
    radial-gradient(circle at 80% 20%, var(--c1), transparent 55%),
    linear-gradient(135deg, transparent 40%, var(--c2) 140%),
    repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 12px); }
.map > * { position: relative; }
.map .mn { font: 700 22px 'Chakra Petch'; letter-spacing: .06em; text-transform: uppercase; }
.map .mg { font: 500 12px 'JetBrains Mono'; color: var(--muted); }
.ring { width: 74px; height: 74px; position: absolute !important; right: 14px; top: 14px; }
.ring .p { position: absolute; inset: 0; display: grid; place-items: center; font: 700 17px 'Chakra Petch'; }
.map .row { display: flex; gap: 16px; margin-top: 34px; font: 600 13px Inter; color: var(--muted); }
.map .row b { display: block; color: var(--text); font: 700 18px 'Chakra Petch'; }
.badge { display: inline-block; margin-top: 8px; font: 700 10px 'JetBrains Mono'; letter-spacing: .15em; padding: 4px 8px; border-radius: 6px; }
.badge.best { background: rgba(79,209,139,0.15); color: var(--win); }
.badge.worst { background: rgba(255,90,95,0.13); color: var(--loss); }

/* ---------- HEATMAP ---------- */
.heat { display: grid; grid-template-columns: 110px repeat(4, 1fr); gap: 6px; font: 600 12px Inter; }
.heat .h { color: var(--muted); font: 700 11px 'JetBrains Mono'; letter-spacing: .1em; text-align: center; align-self: end; padding-bottom: 4px; }
.heat .d { color: var(--muted); align-self: center; }
.cell { height: 46px; border-radius: 8px; display: grid; place-items: center; font: 700 14px 'Chakra Petch';
  border: 1px solid rgba(255,255,255,0.05); transition: transform .15s; }
.cell:hover { transform: scale(1.06); }
.cell small { display: block; font: 500 10px Inter; color: rgba(255,255,255,0.6); }

/* ---------- SQUAD ---------- */
.squad { display: grid; gap: 10px; }
.mate { display: grid; grid-template-columns: 34px 46px 1fr 160px 70px; align-items: center; gap: 14px; padding: 12px 14px;
  border-radius: 12px; background: var(--panel); border: 1px solid var(--line); animation: rise .5s ease both; }
.mate .rk { font: 700 18px 'Chakra Petch'; color: var(--muted); text-align: center; }
.mate:first-child .rk { color: var(--orange); }
.mate .av { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font: 700 20px 'Chakra Petch';
  background: linear-gradient(135deg, var(--c1), var(--c2)); color: #0b0d10; }
.mate .nm { font: 700 17px 'Chakra Petch'; }
.mate .gm { font-size: 12px; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,0.07); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; width: 0; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
.mate .wr { font: 700 20px 'Chakra Petch'; text-align: right; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 18px; align-items: center; text-align: center; }
.vs .big { font: 700 52px 'Chakra Petch'; }
.vs .lab { font: 700 11px 'JetBrains Mono'; letter-spacing: .2em; color: var(--muted); }
.vs .x { font: 700 22px 'Chakra Petch'; color: var(--muted); }

/* ---------- SCOREBOARD TABLE ---------- */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 700 11px 'JetBrains Mono'; letter-spacing: .15em; color: var(--muted); padding: 10px; border-bottom: 1px solid var(--line); }
td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.04); font-variant-numeric: tabular-nums; }
tr:hover td { background: rgba(255,173,59,0.05); }
.res { font: 700 12px 'Chakra Petch'; padding: 3px 9px; border-radius: 6px; }
.res.w { background: rgba(79,209,139,0.15); color: var(--win); }
.res.l { background: rgba(255,90,95,0.13); color: var(--loss); }

/* ---------- HIGHLIGHTS ---------- */
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.shot { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--panel-solid); }
.shot img { width: 100%; display: block; transition: transform .4s; }
.shot:hover img { transform: scale(1.04); }
.shot p { padding: 12px 14px; font: 700 15px 'Chakra Petch'; letter-spacing: .04em; }
.empty { text-align: center; padding: 40px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

footer { margin-top: 26px; color: var(--muted); font: 500 12px 'JetBrains Mono'; text-align: center; letter-spacing: .08em; }

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; text-align: center; justify-items: center; }
  .elo-row { justify-content: center; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .tips, .grid2 { grid-template-columns: 1fr; }
  .mate { grid-template-columns: 30px 40px 1fr 60px; }
  .mate .bar { display: none; }
  .name { font-size: 36px; }
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap" id="app"></div>

<script>
const D = __DATA__;
const $ = (s, el = document) => el.querySelector(s);
const pct = x => (x == null || isNaN(x)) ? "–" : Math.round(x * 100) + "%";
const f2 = x => (x == null || isNaN(x)) ? "–" : x.toFixed(2);
const f0 = x => (x == null || isNaN(x)) ? "–" : Math.round(x);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LEVEL_COLORS = {1:"#e8e8e8",2:"#3edb5a",3:"#3edb5a",4:"#ffc800",5:"#ffc800",6:"#ffc800",7:"#ffc800",8:"#ff6309",9:"#ff6309",10:"#fe1f00"};
const winColor = r => r >= 0.55 ? "var(--win)" : r <= 0.45 ? "var(--loss)" : "var(--orange)";
function hashColors(name) {
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return [`hsl(${h} 85% 58%)`, `hsl(${(h + 50) % 360} 70% 40%)`];
}

/* ---------- build page ---------- */
const p = D.player, s = D.summary;
const lvlColor = LEVEL_COLORS[p.level] || "var(--orange)";
const initials = esc((p.nickname || "?").slice(0, 1).toUpperCase());
const tabs = [
  ["briefing", "🧠 Briefing"], ["matches", "📈 Matches"], ["maps", "🗺️ Map pool"],
  ["timing", "🕒 Timing"], ["squad", "👥 Squad"], ["aim", "🎯 Aim"], ["highlights", "📸 Highlights"],
];

$("#app").innerHTML = `
<div class="hero">
  ${p.avatar ? `<img class="avatar" src="${esc(p.avatar)}" alt="">` : `<div class="avatar">${initials}</div>`}
  <div>
    <div class="kicker">CS Stats Coach · Player card</div>
    <div class="name">${esc(p.nickname)}<span>.</span></div>
    <div class="elo-row">
      <div class="elo-bar"><i id="elobar"></i></div>
      <div class="elo-note">${p.elo} ELO ${p.to_next != null ? `· <b>${p.to_next}</b> to level ${p.level + 1}` : "· max level"}</div>
    </div>
  </div>
  <div class="level" style="--lvl:${lvlColor}">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="${lvlColor}" stroke-opacity=".25" stroke-width="2"/>
      <circle cx="60" cy="60" r="54" fill="none" stroke="${lvlColor}" stroke-width="4" stroke-dasharray="40 300" stroke-linecap="round"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="${lvlColor}" stroke-opacity=".35" stroke-dasharray="3 7"/></svg>
    <div class="num">${p.level ?? "?"}</div><div class="lbl">LEVEL</div>
  </div>
</div>

<div class="stats">
  ${stat("Matches", s.matches, `${s.wins}W · ${s.losses}L`, "🎮", 0)}
  ${stat("Win rate", s.win_rate * 100, "of all matches", "🏆", 0, "%")}
  ${stat("K/D", s.kd, "kills per death", "⚔️", 2)}
  ${stat("Headshot", s.hs, "of my kills", "🎯", 0, "%")}
  ${stat("ADR", s.adr, "damage per round", "💥", 0)}
</div>

<div class="form"><span class="t">LAST ${D.form.length}</span>
  ${D.form.map((w, i) => `<span class="pip ${w ? "w" : "l"}" style="animation-delay:${i * 60}ms">${w ? "W" : "L"}</span>`).join("")}
  <span class="streak">${s.streak_text}</span>
</div>

<nav>${tabs.map(([id, t], i) => `<button data-t="${id}" class="${i ? "" : "on"}">${t}</button>`).join("")}</nav>

<section id="briefing" class="on">
  <h2>Pre-match <span class="q">briefing</span></h2>
  <div class="sub">What your coach learned from your last ${s.matches} matches.</div>
  <div class="tips">${D.tips.length ? D.tips.map((t, i) => `<div class="tip" style="animation-delay:${i * 90}ms"><div class="i">${t.icon}</div><p>${t.html}</p></div>`).join("")
    : `<div class="empty">Play a few more games so the coach has enough to go on!</div>`}</div>
  <div class="note">Tips only use groups with at least ${D.min_games} games, so they aren't just luck.</div>
</section>

<section id="matches">
  <h2>Is my aim getting <span class="q">better?</span></h2>
  <div class="sub">Every match from oldest to newest. The orange line is my average of the last 10 games.</div>
  <div class="panel"><div class="chart"><canvas id="kdChart"></canvas></div></div>
  <h2>Scoreboard</h2>
  <div class="sub">My last ${D.recent.length} matches.</div>
  <div class="panel" style="overflow-x:auto"><table>
    <tr><th>DATE</th><th>MAP</th><th>RESULT</th><th>K</th><th>D</th><th>A</th><th>K/D</th><th>HS%</th><th>ADR</th></tr>
    ${D.recent.map(r => `<tr><td>${esc(r.date)}</td><td>${esc(r.map)}</td><td><span class="res ${r.won ? "w" : "l"}">${r.won ? "WIN" : "LOSS"}</span></td>
      <td>${f0(r.kills)}</td><td>${f0(r.deaths)}</td><td>${f0(r.assists)}</td><td style="color:${r.kd >= 1 ? "var(--win)" : "var(--loss)"}">${f2(r.kd)}</td><td>${f0(r.hs)}%</td><td>${f0(r.adr)}</td></tr>`).join("")}
  </table></div>
</section>

<section id="maps">
  <h2>Which maps am I <span class="q">best</span> on?</h2>
  <div class="sub">The ring shows how often I win on that map.</div>
  <div class="maps">${D.maps.map((m, i) => { const [c1, c2] = hashColors(m.map); return `
    <div class="map" style="--c1:${c1};--c2:${c2};animation:rise .5s ${i * 70}ms ease both">
      <div class="art"></div>
      <div class="mn">${esc(m.map)}</div><div class="mg">${m.games} games</div>
      ${m.tag ? `<span class="badge ${m.tag}">${m.tag === "best" ? "BEST MAP" : "HARDEST MAP"}</span>` : ""}
      <div class="ring">${ring(m.win_rate)}<div class="p">${pct(m.win_rate)}</div></div>
      <div class="row"><div><b>${f2(m.kd)}</b>K/D</div><div><b>${f0(m.hs)}%</b>HS</div><div><b>${f0(m.adr)}</b>ADR</div></div>
    </div>`; }).join("")}</div>
</section>

<section id="timing">
  <h2>Do I play worse <span class="q">late at night?</span></h2>
  <div class="sub">Dutch time. Each square shows my win rate and how many games I played then. Greener is better.</div>
  <div class="panel"><div class="heat" id="heat"></div></div>
  <div class="grid2">
    <div class="panel"><h2 style="font-size:18px">Win rate by time of day</h2><div class="chart"><canvas id="todChart"></canvas></div></div>
    <div class="panel"><h2 style="font-size:18px">K/D by hour</h2><div class="chart"><canvas id="hourChart"></canvas></div></div>
  </div>
</section>

<section id="squad">
  <h2>Which teammates help me <span class="q">win?</span></h2>
  <div class="sub">People who were on my team at least 2 times.</div>
  <div class="panel vs">
    <div><div class="lab">WITH A FRIEND</div><div class="big" style="color:${winColor(D.friends.with)}">${pct(D.friends.with)}</div><div class="gm">${D.friends.with_games} games</div></div>
    <div class="x">VS</div>
    <div><div class="lab">ONLY STRANGERS</div><div class="big" style="color:${winColor(D.friends.without)}">${pct(D.friends.without)}</div><div class="gm">${D.friends.without_games} games</div></div>
  </div>
  <div class="squad">${D.squad.length ? D.squad.map((m, i) => { const [c1, c2] = hashColors(m.name); return `
    <div class="mate" style="--c1:${c1};--c2:${c2};animation-delay:${i * 60}ms">
      <div class="rk">#${i + 1}</div><div class="av">${esc(m.name.slice(0, 1).toUpperCase())}</div>
      <div><div class="nm">${esc(m.name)}</div><div class="gm">${m.games} games together · my K/D ${f2(m.kd)}</div></div>
      <div class="bar"><i data-w="${m.win_rate}" style="background:${winColor(m.win_rate)}"></i></div>
      <div class="wr" style="color:${winColor(m.win_rate)}">${pct(m.win_rate)}</div>
    </div>`; }).join("") : `<div class="empty">No repeat teammates in these matches yet.</div>`}</div>
</section>

<section id="aim">
  <h2>Does good aim mean I <span class="q">win?</span></h2>
  <div class="sub">Every dot is a match. Green = won, red = lost.</div>
  <div class="grid2">
    <div class="panel"><div class="chart"><canvas id="scatter"></canvas></div></div>
    <div class="panel"><div class="chart"><canvas id="hsMap"></canvas></div></div>
  </div>
</section>

<section id="highlights">
  <h2>Highlight <span class="q">reel</span></h2>
  <div class="sub">My own moments from the game.</div>
  ${D.shots.length ? `<div class="shots">${D.shots.map(x => `<div class="shot"><img src="${x.src}" alt=""><p>${esc(x.caption)}</p></div>`).join("")}</div>`
    : `<div class="empty">No screenshots yet. Send them to Claude and they'll appear here!</div>`}
</section>

<footer>DATA · FACEIT DATA API &nbsp;│&nbsp; LOADED ${esc(D.loaded)} &nbsp;│&nbsp; MADE BY ${esc(p.nickname).toUpperCase()}</footer>
`;

function stat(t, v, sub, ico, dec, unit = "") {
  return `<div class="stat"><span class="ico">${ico}</span><div class="t">${t}</div>
    <div class="v" data-count="${v ?? ""}" data-dec="${dec}" data-unit="${unit}">–</div><div class="s">${sub}</div></div>`;
}
function ring(r) {
  const c = 2 * Math.PI * 30, v = isNaN(r) ? 0 : r;
  return `<svg viewBox="0 0 74 74" width="74" height="74"><circle cx="37" cy="37" r="30" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="7"/>
    <circle cx="37" cy="37" r="30" fill="none" stroke="${winColor(v)}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c * v} ${c}" transform="rotate(-90 37 37)"/></svg>`;
}

/* ---------- animations ---------- */
document.querySelectorAll("[data-count]").forEach(el => {
  const target = parseFloat(el.dataset.count), dec = +el.dataset.dec, unit = el.dataset.unit;
  if (isNaN(target)) return;
  const t0 = performance.now();
  (function tick(now) {
    const k = Math.min(1, (now - t0) / 1200), e = 1 - Math.pow(1 - k, 3);
    el.textContent = (target * e).toFixed(dec) + unit;
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
});
setTimeout(() => { $("#elobar").style.width = (p.progress * 100) + "%"; }, 200);
function growBars(root) { root.querySelectorAll(".bar i").forEach(b => b.style.width = (b.dataset.w * 100) + "%"); }

/* heatmap */
(function () {
  const h = $("#heat"); let html = `<div></div>` + D.heat.cols.map(c => `<div class="h">${c.toUpperCase()}</div>`).join("");
  D.heat.rows.forEach(r => {
    html += `<div class="d">${r.day}</div>`;
    r.cells.forEach(c => {
      if (!c.games) { html += `<div class="cell" style="background:rgba(255,255,255,0.02);color:var(--muted)">·</div>`; return; }
      const g = Math.round(c.win_rate * 100), hue = Math.round(c.win_rate * 130);
      const a = Math.min(0.85, 0.25 + c.games * 0.08);
      html += `<div class="cell" style="background:hsla(${hue},75%,45%,${a})">${g}%<small>${c.games} g</small></div>`;
    });
  });
  h.innerHTML = html;
})();

/* ---------- charts ---------- */
const charts = {};
function setupCharts(id) {
  if (!window.Chart || charts[id]) return;
  Chart.defaults.color = "#8f96a3"; Chart.defaults.font.family = "Inter";
  Chart.defaults.borderColor = "rgba(255,255,255,0.06)";
  const grid = { color: "rgba(255,255,255,0.05)" };
  if (id === "matches") {
    const ctx = $("#kdChart").getContext("2d");
    const grad = ctx.createLinearGradient(0, 0, 0, 300);
    grad.addColorStop(0, "rgba(255,173,59,0.35)"); grad.addColorStop(1, "rgba(255,173,59,0)");
    charts[id] = new Chart(ctx, { type: "line", data: { labels: D.kd.map(x => x.n), datasets: [
      { label: "K/D per match", data: D.kd.map(x => x.kd), borderColor: "rgba(110,195,255,0.55)", borderWidth: 1.5,
        pointRadius: 3, pointBackgroundColor: D.kd.map(x => x.won ? "#4fd18b" : "#ff5a5f"), tension: .25 },
      { label: "Average of last 10", data: D.kd.map(x => x.avg10), borderColor: "#ffad3b", borderWidth: 4, pointRadius: 0,
        fill: true, backgroundColor: grad, tension: .4 },
      { label: "K/D = 1", data: D.kd.map(() => 1), borderColor: "rgba(255,255,255,0.3)", borderDash: [5, 5], borderWidth: 1, pointRadius: 0 },
    ]}, options: { maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { tooltip: { callbacks: { title: i => `Match ${D.kd[i[0].dataIndex].n} · ${D.kd[i[0].dataIndex].map}` } } },
      scales: { x: { grid, title: { display: true, text: "Match (oldest → newest)" } }, y: { grid } } } });
  }
  if (id === "timing") {
    charts.tod = new Chart($("#todChart"), { type: "bar", data: { labels: D.tod.map(x => x.label), datasets: [{
      data: D.tod.map(x => x.win_rate * 100), backgroundColor: D.tod.map(x => x.win_rate >= .5 ? "#4fd18b" : "#ff7a1a"), borderRadius: 8 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => `${Math.round(c.raw)}% wins · ${D.tod[c.dataIndex].games} games` } } },
        scales: { y: { min: 0, max: 100, grid, ticks: { callback: v => v + "%" } }, x: { grid: { display: false } } } } });
    charts[id] = new Chart($("#hourChart"), { type: "bar", data: { labels: D.hours.map(x => x.hour + ":00"), datasets: [{
      data: D.hours.map(x => x.kd), backgroundColor: D.hours.map(x => x.kd >= 1 ? "#ffad3b" : "rgba(255,173,59,0.35)"), borderRadius: 6 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => `K/D ${c.raw.toFixed(2)} · ${D.hours[c.dataIndex].games} games` } } },
        scales: { y: { grid }, x: { grid: { display: false } } } } });
  }
  if (id === "aim") {
    charts.sc = new Chart($("#scatter"), { type: "scatter", data: { datasets: [
      { label: "Won", data: D.points.filter(x => x.won).map(x => ({ x: x.hs, y: x.kd })), backgroundColor: "rgba(79,209,139,0.8)", pointRadius: 5 },
      { label: "Lost", data: D.points.filter(x => !x.won).map(x => ({ x: x.hs, y: x.kd })), backgroundColor: "rgba(255,90,95,0.75)", pointRadius: 5 },
    ]}, options: { maintainAspectRatio: false, scales: { x: { grid, title: { display: true, text: "Headshot %" } },
      y: { grid, title: { display: true, text: "K/D" } } } } });
    const avg = D.summary.hs;
    charts[id] = new Chart($("#hsMap"), { type: "bar", data: { labels: D.maps.map(m => m.map), datasets: [
      { label: "Headshot % per map", data: D.maps.map(m => m.hs), backgroundColor: D.maps.map(m => m.hs >= avg ? "#ffad3b" : "rgba(255,173,59,0.35)"), borderRadius: 8 }] },
      options: { indexAxis: "y", maintainAspectRatio: false, plugins: { legend: { display: false },
        title: { display: true, text: `Headshot % per map (my average: ${Math.round(avg)}%)`, color: "#ece7da" } },
        scales: { x: { grid }, y: { grid: { display: false } } } } });
  }
}

/* ---------- tabs ---------- */
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("section").forEach(sec => sec.classList.toggle("on", sec.id === b.dataset.t));
  setupCharts(b.dataset.t); growBars(document);
}));
</script>
</body>
</html>

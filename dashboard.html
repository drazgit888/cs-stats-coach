<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* CS Stats Coach v5 – "analyst's console" design system.
   Quiet surfaces, colour only where it means something. Tokens are documented in docs/design-system.md.
   Source colours (FACEIT, Leetify, Steam, Premier) are only used for that source's data. */
:root {
  /* surfaces */
  --bg: #0E0D12; --s1: #17151E; --s2: #1F1C28; --s3: #29253A; --line: #2D2A3A;
  /* text */
  --text: #F4F2F8; --text2: #C4C1CF; --muted: #8E8A9C;
  /* brand */
  --violet: #8B5CF6; --violet-hi: #A78BFA; --violet-deep: #5B3BB8; --magenta: #E055C8;
  /* results */
  --win: #3DD68C; --loss: #F0606A;
  /* data sources */
  --faceit: #FF5500; --leetify: #F84982; --steam: #8FB3D9; --premier: #4FD1E8;
  /* type */
  --f-head: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: Inter, "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  /* shape */
  --r-sm: 8px; --r-tile: 10px; --r-card: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text2); font: 14px/1.55 var(--f-body); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
b, strong { color: var(--text); font-weight: 600; }
:focus-visible { outline: 2px solid var(--violet-hi); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell: sidebar + main ---------- */
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--s1); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 16px; font: 700 16px var(--f-head); color: var(--text); letter-spacing: -.01em; }
.brand .mk { width: 26px; height: 26px; border-radius: 7px; background: var(--violet); display: grid; place-items: center; }
.brand em { font-style: normal; color: var(--violet-hi); }
.grp { font: 500 10px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .09em; padding: 14px 10px 4px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; cursor: pointer; text-align: left;
  font-size: 13.5px; padding: 8px 10px; border-radius: var(--r-sm); color: var(--text2); transition: background .15s, color .15s; }
.nav:hover { background: var(--s2); color: var(--text); }
.nav.on { background: var(--s3); color: var(--text); box-shadow: inset 2px 0 0 var(--violet); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--muted); }
.nav.on .dot.plain { background: var(--violet); }
.side .foot { margin-top: auto; padding: 18px 10px 0; font-size: 11px; color: var(--muted); line-height: 1.5; }

.main { min-width: 0; padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 18px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.crumb { font-size: 13px; color: var(--muted); }
.crumb b { font: 600 15px var(--f-head); color: var(--text); margin-right: 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; background: var(--s1); border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--text2); white-space: nowrap; }
.chip.off { color: var(--muted); }

/* ---------- pages ---------- */
.page { display: none; flex-direction: column; gap: 16px; }
.page.on { display: flex; animation: fade .25s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
h1 { font: 600 24px/1.2 var(--f-head); color: var(--text); letter-spacing: -.01em; text-wrap: balance; }
.lead { color: var(--text2); max-width: 70ch; margin-top: 4px; }
.src { display: inline-flex; align-items: center; gap: 6px; font: 500 10.5px var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); white-space: nowrap; }

/* ---------- cards ---------- */
.cards { display: grid; gap: 16px; }
.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card { position: relative; background: var(--s1); border-radius: var(--r-card); padding: 16px; min-width: 0; transition: background .15s; }
.card h3 { font: 600 18px var(--f-head); color: var(--text); margin-bottom: 6px; }
.card h4 { font: 600 14px var(--f-head); color: var(--text); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card p { font-size: 13.5px; }
.card .ico { width: 26px; height: 26px; margin-bottom: 12px; color: var(--violet-hi); }
.empty, .na { color: var(--muted); }
.na { font-style: italic; }
.card.top-faceit { box-shadow: inset 0 2px 0 var(--faceit); }
.card.top-leetify { box-shadow: inset 0 2px 0 var(--leetify); }
.card.top-premier { box-shadow: inset 0 2px 0 var(--premier); }
.card.top-steam { box-shadow: inset 0 2px 0 var(--steam); }

/* ---------- profile ---------- */
.idcard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 18px; align-items: center; }
.avatar { width: 76px; height: 76px; border-radius: 18px; object-fit: cover; background: var(--s3);
  box-shadow: 0 0 0 2px var(--s1), 0 0 0 4px var(--violet); display: grid; place-items: center; font: 700 30px var(--f-head); color: var(--violet-hi); }
.who h2 { font: 700 26px/1.1 var(--f-head); color: var(--text); letter-spacing: -.01em; }
.who .links { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.who .links a { color: var(--text2); border-bottom: 1px solid transparent; transition: color .15s, border-color .15s; }
.who .links a:hover { color: var(--text); border-color: var(--violet-hi); }
.who .tagline { margin-top: 6px; font-size: 13px; color: var(--muted); }
.tiles { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--s2); border-radius: var(--r-tile); padding: 11px 13px; min-width: 0; }
.tile .v { font: 600 24px/1.25 var(--f-head); color: var(--text); font-variant-numeric: tabular-nums; margin-top: 2px; overflow-wrap: anywhere; }
.tile .v.off { font: 500 15px/1.6 var(--f-body); color: var(--muted); padding: 3px 0 2px; }
.tile .s { font-size: 11.5px; color: var(--muted); }
.lvl { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--faceit); color: var(--faceit);
  font: 700 12px var(--f-head); margin-right: 8px; vertical-align: 3px; }
.meter { height: 4px; background: var(--s3); border-radius: 4px; margin-top: 7px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--faceit); transition: width 1s cubic-bezier(.2,.8,.2,1); }

.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--s1); border-radius: var(--r-card); padding: 14px 4px; }
.kpis > div { padding: 0 16px; border-left: 1px solid var(--line); min-width: 0; }
.kpis > div:first-child { border-left: 0; }
.kpis .l { font-size: 12px; color: var(--muted); }
.kpis .v { font: 600 22px/1.3 var(--f-head); color: var(--text); font-variant-numeric: tabular-nums; }
.kpis .s { font-size: 11.5px; color: var(--muted); }
.form { display: flex; gap: 3px; margin: 8px 0 4px; }
.form i { width: 10px; height: 16px; border-radius: 2px; }
.w-bg { background: var(--win); } .l-bg { background: var(--loss); }

.split { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 16px; }
.split.even { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.seg { display: inline-flex; gap: 2px; background: var(--s2); border-radius: var(--r-sm); padding: 3px; margin: 6px 0 4px; flex-wrap: wrap; }
.seg button { border: 0; background: none; cursor: pointer; font-size: 12px; padding: 4px 10px; border-radius: 6px; color: var(--muted); transition: background .15s, color .15s; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--s3); color: var(--text); }
.caption { font-size: 12px; color: var(--muted); margin-top: 6px; }
.chart { position: relative; height: 240px; margin-top: 8px; }
.chart.tall { height: 300px; }
.chart.radar { height: 230px; }

.mlist { margin-top: 6px; }
.mrow { display: grid; grid-template-columns: 4px 96px minmax(70px, 1fr) 64px 66px 60px; gap: 4px 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.mrow:last-child { border-bottom: 0; }
.mrow .rb { height: 30px; border-radius: 2px; grid-row: span 2; align-self: start; margin-top: 2px; }
.mrow .d { font-size: 11px; color: var(--muted); line-height: 1.3; white-space: nowrap; }
.mrow .m { color: var(--text); font-weight: 500; }
.mrow .kda { font-variant-numeric: tabular-nums; color: var(--text2); }
.mrow .n { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.mrow .dl { grid-column: 3 / -1; font: 11px var(--f-mono); color: var(--muted); }
.up { color: var(--win); } .dn { color: var(--loss); }

.insights { display: grid; gap: 10px; margin-top: 8px; }
.ins { background: var(--s2); border-radius: var(--r-tile); padding: 11px 13px; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.ins svg { width: 20px; height: 20px; color: var(--violet-hi); margin-top: 1px; }
.ins b { color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; border-radius: var(--r-sm); padding: 7px 13px; font-size: 13px; font-weight: 500; transition: background .15s, color .15s; }
.btn.ghost { background: var(--s2); color: var(--text2); }
.btn.ghost:hover { background: var(--s3); color: var(--text); }
.btn.primary { background: var(--violet); color: #fff; }
.btn.primary:hover { background: var(--violet-hi); color: var(--bg); }

/* ---------- shared bits used on other pages ---------- */
.prog { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.prog .bar { flex: 1; height: 6px; background: var(--s3); border-radius: 3px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; width: 0; background: var(--violet); transition: width 1s cubic-bezier(.2,.8,.2,1); }
.prog .n { font: 500 12px var(--f-mono); color: var(--muted); min-width: 46px; text-align: right; }
.tag { display: inline-block; font: 500 10.5px var(--f-mono); letter-spacing: .06em; padding: 2px 8px; border-radius: 6px; margin-bottom: 8px; }
.tag.best { background: rgba(224, 85, 200, .16); color: var(--magenta); }
.tag.worst { background: rgba(240, 96, 106, .14); color: var(--loss); }
.minis { display: flex; gap: 22px; margin-top: 10px; }
.minis div { font-size: 11.5px; color: var(--muted); }
.minis b { display: block; font: 600 19px var(--f-head); color: var(--text); font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.ring { position: relative; width: 150px; height: 150px; margin: 12px auto 8px; }
.ring svg { transform: rotate(-90deg); }
.ring .rv { position: absolute; inset: 0; display: grid; place-items: center; font: 600 34px var(--f-head); color: var(--text); }
.ring circle.fg { transition: stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1); }
.streak { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 28px 0 22px; }
.streak .flame { width: 46px; height: 54px; }
.streak .sv { font: 600 32px var(--f-head); color: var(--text); }
.hr { border-top: 1px solid var(--line); padding-top: 12px; color: var(--muted); }
.checks { list-style: none; margin-top: 6px; }
.checks li { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.checks li:last-child { border: 0; }
.checks svg { width: 16px; height: 16px; flex: none; }
.checks small { color: var(--muted); margin-left: auto; font-size: 11.5px; white-space: nowrap; }
.heat { display: grid; grid-template-columns: 52px repeat(4, minmax(0, 1fr)); gap: 5px; margin-top: 12px; }
.heat .h { font: 500 10.5px var(--f-mono); color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: .05em; }
.heat .d { font: 500 11px var(--f-mono); color: var(--muted); align-self: center; text-transform: uppercase; }
.cell { height: 42px; border-radius: 6px; display: grid; place-items: center; align-content: center; font: 600 14px var(--f-head); font-variant-numeric: tabular-nums; }
.cell small { display: block; font: 400 10px var(--f-body); opacity: .75; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
th { text-align: left; font: 500 10.5px var(--f-mono); letter-spacing: .07em; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); text-transform: uppercase; white-space: nowrap; }
td { padding: 8px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--s2); }
.res { font: 500 11px var(--f-mono); letter-spacing: .05em; padding: 2px 8px; border-radius: 6px; }
.res.w { background: rgba(61, 214, 140, .14); color: var(--win); }
.res.l { background: rgba(240, 96, 106, .14); color: var(--loss); }
.sq-av { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 12px;
  font: 700 18px var(--f-head); color: var(--violet-hi); background: var(--s3); }
.rank { position: absolute; right: 16px; top: 14px; font: 600 13px var(--f-mono); color: var(--muted); }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 12px; }
.vs .big { font: 600 44px/1.1 var(--f-head); color: var(--text); font-variant-numeric: tabular-nums; }
.vs .big.hi { color: var(--violet-hi); }
.vs .x { font: 500 12px var(--f-mono); color: var(--muted); }
.vs .lab { font-size: 12px; color: var(--muted); }
.shot { padding: 0; overflow: hidden; }
.shot img { width: 100%; display: block; transition: transform .4s; }
.shot:hover img { transform: scale(1.02); }
.shot p { padding: 12px 16px; color: var(--text); font-weight: 500; }

/* ---------- Leetify (official badge shown unmodified, never animated or recoloured) ---------- */
#leetify.page.on { animation: none; }
.lt-badge { display: inline-block; line-height: 0; }
.lt-badge img { height: 40px; width: auto; display: block; }
.lt-badge.large img { height: 72px; }
.lt-link { color: var(--leetify); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px 16px; margin-top: 10px; font-size: 13.5px; }
.kv span { color: var(--muted); }
.kv b { font: 600 15px var(--f-head); text-align: right; font-variant-numeric: tabular-nums; }
.chk { list-style: none; margin-top: 8px; }
.chk li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; }
.chk code { font: 11.5px var(--f-mono); color: var(--muted); word-break: break-word; text-align: right; }
.yes { color: var(--win); font-weight: 600; } .no { color: var(--loss); font-weight: 600; }
details.card summary { cursor: pointer; font: 600 14px var(--f-head); color: var(--text); list-style: none; display: flex; justify-content: space-between; }
details.card summary::after { content: "Show"; font: 500 12px var(--f-body); color: var(--muted); }
details.card[open] summary::after { content: "Hide"; }
.big-v { font: 600 34px/1.2 var(--f-head); color: var(--text); font-variant-numeric: tabular-nums; margin: 6px 0 2px; }

footer { padding: 16px 0 4px; color: var(--muted); font-size: 11.5px; border-top: 1px solid var(--line); margin-top: 8px; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; }
  .kpis > div:nth-child(4) { border-left: 0; }
  .c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 980px) {
  .split, .split.even, .c3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { flex-direction: row; align-items: center; overflow-x: auto; gap: 4px; padding: 10px 12px; position: sticky; top: 0; z-index: 5; }
  .side .grp, .side .foot { display: none; }
  .brand { padding: 0 8px 0 2px; }
  .brand span:last-child { display: none; }
  .nav { width: auto; white-space: nowrap; padding: 7px 11px; }
  .nav.on { box-shadow: inset 0 -2px 0 var(--violet); }
  .main { padding: 14px 16px 20px; }
  .c2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .c4 { grid-template-columns: minmax(0, 1fr); }
  .idcard { grid-template-columns: minmax(0, 1fr); }
  .avatar { width: 64px; height: 64px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis > div { border-left: 0; }
  .mrow { grid-template-columns: 4px 84px minmax(0, 1fr) 60px; }
  .mrow .hide { display: none; }
  .vs .big { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const D = __DATA__;
const $ = (s, el = document) => el.querySelector(s);
const pct = x => (x == null || isNaN(x)) ? "–" : Math.round(x * 100) + "%";
const f2 = x => (x == null || isNaN(x)) ? "–" : Number(x).toFixed(2);
const f1 = x => (x == null || isNaN(x)) ? "–" : Number(x).toFixed(1);
const f0 = x => (x == null || isNaN(x)) ? "–" : Math.round(x);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const p = D.player, s = D.summary, L = D.leetify;
const LT_OK = !!(L && L.status === "ok" && L.profile);
const ST = D.steam, ST_OK = !!(ST && ST.status === "ok" && ST.profile);
const steamUrl = ST_OK ? ST.profile.url : (p.steam_id64 ? `https://steamcommunity.com/profiles/${p.steam_id64}` : "");
const hrs = v => isNum(v) ? (v >= 100 ? Math.round(v).toLocaleString("en-US") : v.toFixed(1)) + " h" : "–";
const C = Object.fromEntries(["bg","s1","s2","s3","line","text","text2","muted","violet","violet-hi","violet-deep","magenta","win","loss","faceit","leetify","steam","premier"]
  .map(k => [k, getComputedStyle(document.documentElement).getPropertyValue("--" + k).trim()]));

/* ---------- line icons (drawn by me) ---------- */
const I = {
  cross: `<circle cx="24" cy="24" r="13"/><path d="M24 4v10M24 34v10M4 24h10M34 24h10"/>`,
  star: `<path d="M24 5l5.6 12 13 1.4-9.7 8.8 2.8 12.8L24 33.4 12.3 40l2.8-12.8L5.4 18.4l13-1.4z"/>`,
  map: `<path d="M5 10l12-4 14 5 12-4v31l-12 4-14-5-12 4z"/><path d="M17 6v31M31 11v31"/>`,
  users: `<circle cx="24" cy="16" r="6"/><circle cx="11" cy="20" r="4.5"/><circle cx="37" cy="20" r="4.5"/><path d="M13 40c0-7 5-12 11-12s11 5 11 12M3 38c0-5 3-9 8-9M45 38c0-5-3-9-8-9"/>`,
  clock: `<circle cx="24" cy="24" r="18"/><path d="M24 12v12l8 5"/>`,
  shield: `<path d="M24 4l16 6v12c0 10-7 18-16 22C15 40 8 32 8 22V10z"/><path d="M17 24l5 5 9-10"/>`,
  chart: `<path d="M5 40h38"/><path d="M8 32l10-10 8 6 14-16"/><path d="M34 12h6v6"/>`,
  brain: `<path d="M18 8a6 6 0 0 0-6 6 6 6 0 0 0-4 10 6 6 0 0 0 4 10 6 6 0 0 0 10 4V8zM30 8a6 6 0 0 1 6 6 6 6 0 0 1 4 10 6 6 0 0 1-4 10 6 6 0 0 1-10 4V8z"/>`,
};
const icon = (n, cls = "ico") => `<svg class="${cls}" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n] || I.star}</svg>`;
const check = `<svg viewBox="0 0 20 20" fill="none" stroke="${C.win}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5l4.5 4.5L17 5"/></svg>`;
const tipIcons = { "🗺️": "map", "🚫": "shield", "🕒": "clock", "📈": "chart", "📉": "chart", "😤": "brain", "🧊": "brain", "🤝": "users", "🎯": "cross" };

/* ---------- small components ---------- */
const dot = src => `<span class="dot" style="background:var(--${src})"></span>`;
const srcTag = (src, text) => `<span class="src" style="color:var(--${src === "plain" ? "muted" : src})">${src === "plain" ? "" : dot(src)}${esc(text)}</span>`;
const pageHead = (title, lead, tag = "") => `<div class="ph"><div><h1>${title}</h1>${lead ? `<p class="lead">${lead}</p>` : ""}</div>${tag}</div>`;
function bar(frac, label) {
  return `<div class="prog"><div class="bar"><i data-w="${Math.max(0, Math.min(1, frac || 0))}"></i></div><div class="n">${label}</div></div>`;
}
const raw = v => (v === null || v === undefined || v === "") ? `<span class="na">Not available from Leetify</span>` : esc(typeof v === "object" ? JSON.stringify(v) : v);
const title = k => esc(String(k).replace(/_/g, " ").replace(/^./, c => c.toUpperCase()));
const yn = v => v === true ? `<span class="yes">Yes</span>` : v === false ? `<span class="no">No</span>` : `<span class="na">Not checked</span>`;
const ltBadge = (big) => L && L.badge_small ? `<a class="lt-badge ${big ? "large" : ""}" href="https://leetify.com/" target="_blank" rel="noopener"><img src="${big ? L.badge_large : L.badge_small}" alt="Data Provided by Leetify"></a>` : "";
const ltView = () => L ? `<a class="lt-link" href="${esc(L.profile_url)}" target="_blank" rel="noopener">View on Leetify</a>` : "";
const fsum = `last ${s.matches} matches`;

/* ---------- navigation model ---------- */
const NAV = [
  ["Player", [["profile", "Profile", "plain"], ["briefing", "Coach briefing", "plain"]]],
  ["Performance", [["matches", "Matches", "plain"], ["maps", "Maps", "plain"], ["progress", "Progress", "plain"], ["squad", "Squad", "plain"]]],
  ["Sources", [["leetify", "Leetify", "leetify"], ["premier", "Premier", "premier"], ["steam", "Steam", "steam"]]],
  ["Media", [["highlights", "Highlights", "plain"]]],
];
const TITLES = Object.fromEntries(NAV.flatMap(g => g[1].map(([id, t]) => [id, t])));

/* =================================================================
   PROFILE
   ================================================================= */
function profilePage() {
  const ranks = LT_OK ? (L.profile.ranks || {}) : {};
  const ltOffText = !L ? "Leetify is turned off" : (L.message || "Leetify not available");

  const faceitTile = `<div class="tile">${srcTag("faceit", "FACEIT")}
      <div class="v"><span class="lvl" title="FACEIT level">${p.level ?? "?"}</span><span data-count="${p.elo ?? ""}" data-dec="0">${p.elo ?? "–"}</span></div>
      <div class="s">Elo · ${p.to_next != null ? `${p.to_next} to level ${p.level + 1}` : "max level"}</div>
      <div class="meter"><i data-w="${p.progress || 0}"></i></div></div>`;
  const premierTile = `<div class="tile">${srcTag("premier", "Premier")}
      ${LT_OK && ranks.premier != null ? `<div class="v">${raw(ranks.premier)}</div><div class="s">rating · via Leetify</div>`
        : `<div class="v off">${LT_OK ? "Not returned" : "Not available"}</div><div class="s">${LT_OK ? "Leetify sent no Premier rating" : esc(ltOffText)}</div>`}</div>`;
  const leetifyTile = `<div class="tile">${srcTag("leetify", "Leetify")}
      ${LT_OK && ranks.leetify != null ? `<div class="v">${raw(ranks.leetify)}</div><div class="s">Leetify rating</div>`
        : `<div class="v off">${LT_OK ? "Not returned" : "Not available"}</div><div class="s">${LT_OK ? "No Leetify rating in the answer" : esc(ltOffText)}</div>`}</div>`;
  let stV, stS;
  if (ST_OK && ST.cs2 && ST.cs2.found) { stV = `<div class="v">${hrs(ST.cs2.hours_total)}</div>`; stS = `CS2 playtime · ${hrs(ST.cs2.hours_2weeks)} last 2 weeks`; }
  else if (ST_OK && ST.games_visible === false) { stV = `<div class="v off">Hours private</div>`; stS = "Set Game details to Public in Steam"; }
  else if (ST_OK) { stV = `<div class="v off">No CS2 hours</div>`; stS = esc(ST.games_message || "Steam sent no CS2 playtime"); }
  else if (ST) { stV = `<div class="v off">Unavailable</div>`; stS = esc(ST.message || "Steam not available"); }
  else { stV = `<div class="v off">Not connected</div>`; stS = "CS2 hours need a Steam key"; }
  const steamTile = `<div class="tile">${srcTag("steam", "Steam")}${stV}<div class="s">${stS}</div></div>`;

  const links = [
    p.country ? `<span>${esc(p.country)}</span>` : "",
    p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">FACEIT profile ↗</a>` : "",
    LT_OK ? `<a href="${esc(L.profile_url)}" target="_blank" rel="noopener">Leetify ↗</a>` : "",
    steamUrl ? `<a href="${esc(steamUrl)}" target="_blank" rel="noopener">Steam profile ↗</a>` : "",
  ].filter(Boolean).join("");

  const identity = `<div class="card idcard">
      ${p.avatar ? `<img class="avatar" src="${esc(p.avatar)}" alt="${esc(p.nickname)} avatar">` : `<div class="avatar">${esc((p.nickname || "?").slice(0, 1).toUpperCase())}</div>`}
      <div class="who"><h2>${esc(p.nickname)}</h2><div class="links">${links}</div>
        <p class="tagline">Your CS2 stats, your own progression. A personal coach built from your last ${s.matches} FACEIT matches.</p></div>
      <div class="tiles">${faceitTile}${premierTile}${leetifyTile}${steamTile}</div></div>`;

  const form = D.form.map(w => `<i class="${w ? "w-bg" : "l-bg"}" title="${w ? "Win" : "Loss"}"></i>`).join("");
  const kpis = `<div class="kpis" aria-label="FACEIT stats">
      <div><div class="l">FACEIT matches</div><div class="v">${s.matches}</div><div class="s">${s.wins}W · ${s.losses}L</div></div>
      <div><div class="l">Win rate</div><div class="v" data-count="${isNum(s.win_rate) ? s.win_rate * 100 : ""}" data-dec="0" data-unit="%">${pct(s.win_rate)}</div><div class="s">${fsum}</div></div>
      <div><div class="l">K/D</div><div class="v" data-count="${s.kd ?? ""}" data-dec="2">${f2(s.kd)}</div><div class="s">average per match</div></div>
      <div><div class="l">ADR</div><div class="v" data-count="${s.adr ?? ""}" data-dec="1">${f1(s.adr)}</div><div class="s">damage per round</div></div>
      <div><div class="l">HS%</div><div class="v" data-count="${s.hs ?? ""}" data-dec="0" data-unit="%">${f0(s.hs)}%</div><div class="s">headshot kills</div></div>
      <div><div class="l">Last ${D.form.length}</div><div class="form">${form}</div><div class="s">${s.streak} ${s.streak_win ? (s.streak > 1 ? "wins" : "win") : (s.streak > 1 ? "losses" : "loss")} in a row</div></div>
    </div>`;

  const trend = `<div class="card"><h4>Performance trend ${srcTag("faceit", "FACEIT")}</h4>
      <div class="seg" role="tablist" id="trendSeg">${[["kd", "K/D"], ["wr", "Win rate"], ["adr", "ADR"], ["hs", "HS%"]].map(([k, t], i) =>
        `<button role="tab" data-m="${k}" class="${i ? "" : "on"}" aria-selected="${!i}">${t}</button>`).join("")}</div>
      <div class="chart"><canvas id="trendChart" aria-label="Performance trend chart"></canvas></div>
      <p class="caption" id="trendCap"></p></div>`;

  const rt = LT_OK ? (L.profile.rating || {}) : {};
  const radarOk = ["aim", "positioning", "utility"].every(k => isNum(rt[k]));
  const radar = `<div class="card top-leetify"><h4>Leetify ratings ${srcTag("leetify", "Leetify")}</h4>
      ${radarOk ? `<div class="chart radar"><canvas id="radarChart" aria-label="Aim, Positioning and Utility as returned by Leetify"></canvas></div>
        <p class="caption">Aim ${esc(rt.aim)} · Positioning ${esc(rt.positioning)} · Utility ${esc(rt.utility)}, exactly as Leetify returns them.</p>`
        : `<p class="empty" style="margin:18px 0">${LT_OK ? "Leetify did not return Aim, Positioning and Utility." : esc(ltOffText) + ". Turn it on with LEETIFY_ENABLED in Secrets."}</p>`}
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap">${ltBadge(false)}${ltView()}</div></div>`;

  // Recent matches compared with my own FACEIT averages (same source, so the comparison is fair)
  const delta = (v, avg, lim, fmt, name) => {
    if (!isNum(v) || !isNum(avg) || Math.abs(v - avg) < lim) return "";
    const up = v > avg; return `<span class="${up ? "up" : "dn"}">${up ? "▲" : "▼"} ${name} ${up ? "+" : "−"}${fmt(Math.abs(v - avg))}</span>`;
  };
  const rows = D.recent.slice(0, 6).map(r => {
    const ds = [delta(r.kd, s.kd, 0.25, f2, "K/D"), delta(r.adr, s.adr, 12, f0, "ADR"), delta(r.hs, s.hs, 10, f0, "HS%")].filter(Boolean);
    return `<div class="mrow"><i class="rb ${r.won ? "w-bg" : "l-bg"}" title="${r.won ? "Win" : "Loss"}"></i>
      <div><div class="m">${esc(r.map)}</div><div class="d">${esc(r.date)}</div></div>
      <span class="kda">${f0(r.kills)} / ${f0(r.deaths)} / ${f0(r.assists)}</span>
      <span class="n">K/D ${f2(r.kd)}</span><span class="n hide">ADR ${f0(r.adr)}</span><span class="n hide">HS ${f0(r.hs)}%</span>
      <div class="dl">${ds.length ? ds.join(" · ") : "close to your average"}</div></div>`;
  }).join("");
  const recent = `<div class="card"><h4>Recent matches ${srcTag("faceit", "FACEIT · vs your average")}</h4>
      <div class="mlist">${rows || `<p class="empty">No matches yet.</p>`}</div>
      <div style="margin-top:10px"><button class="btn ghost" data-go="matches">All matches ›</button></div></div>`;

  const tips = D.tips.slice(0, 3);
  const focus = `<div class="card"><h4>Coach focus ${srcTag("plain", "rules need " + D.min_games + "+ games")}</h4>
      <div class="insights">${tips.length ? tips.map(t => `<div class="ins">${icon(tipIcons[t.icon], "")}<div>${t.html}</div></div>`).join("")
        : `<p class="empty">Play a few more games so the coach has enough to go on.</p>`}</div>
      <div style="margin-top:10px"><button class="btn ghost" data-go="briefing">Full briefing ›</button></div></div>`;

  return `${identity}${kpis}<div class="split">${trend}${radar}</div><div class="split even">${recent}${focus}</div>`;
}

/* =================================================================
   OTHER PAGES (same content as v4, new design system)
   ================================================================= */
const briefing = `${pageHead("Coach briefing", `What your coach learned. Only groups with ${D.min_games}+ games count, so it isn't just luck.`, srcTag("faceit", "FACEIT · " + fsum))}
  <div class="cards c3">${D.tips.length ? D.tips.map(t => `
    <div class="card">${icon(tipIcons[t.icon])}<p>${t.html}</p></div>`).join("")
    : `<div class="card"><p class="empty">Play a few more games so the coach has enough to go on!</p></div>`}</div>`;

const matchesPage = `${pageHead("Matches", "Is my aim getting better? Every match from oldest to newest. The dashed line is the average of the last 10.", srcTag("faceit", "FACEIT · " + fsum))}
  <div class="card"><h4>K/D over time</h4><div class="chart tall"><canvas id="kdChart"></canvas></div></div>
  <div class="card tbl"><h4>Scoreboard · last ${D.recent.length}</h4><table>
    <thead><tr><th>Date</th><th>Map</th><th>Result</th><th>K</th><th>D</th><th>A</th><th>K/D</th><th>HS%</th><th>ADR</th></tr></thead><tbody>
    ${D.recent.map(r => `<tr><td>${esc(r.date)}</td><td>${esc(r.map)}</td><td><span class="res ${r.won ? "w" : "l"}">${r.won ? "WIN" : "LOSS"}</span></td>
      <td>${f0(r.kills)}</td><td>${f0(r.deaths)}</td><td>${f0(r.assists)}</td><td style="color:${r.kd >= 1 ? "var(--win)" : "var(--loss)"}">${f2(r.kd)}</td><td>${f0(r.hs)}%</td><td>${f0(r.adr)}</td></tr>`).join("")}
  </tbody></table></div>`;

const mapsPage = `${pageHead("Maps", "Which maps am I best on? The bar shows how many of my games I win there.", srcTag("faceit", "FACEIT · " + fsum))}
  <div class="cards c4">${D.maps.map(m => `
    <div class="card">
      ${m.tag ? `<span class="tag ${m.tag}">${m.tag === "best" ? "BEST MAP" : "HARDEST MAP"}</span>` : `<span class="tag" style="padding-left:0">${m.games} games</span>`}
      <h3>${esc(m.map)}</h3>
      <div class="minis"><div><b>${f2(m.kd)}</b>K/D</div><div><b>${f0(m.hs)}%</b>HS</div><div><b>${f0(m.adr)}</b>ADR</div></div>
      ${bar(m.win_rate, `${Math.round(m.win_rate * m.games)} / ${m.games}`)}
    </div>`).join("")}</div>
  <div class="cards c2">
    <div class="card"><h4>Does good aim mean I win?</h4><p>Every dot is a match. Green = won, red = lost.</p><div class="chart"><canvas id="scatter"></canvas></div></div>
    <div class="card"><h4>Headshot % per map</h4><p>My average is ${f0(s.hs)}%.</p><div class="chart"><canvas id="hsMap"></canvas></div></div>
  </div>`;

const squadPage = `${pageHead("Squad", "Which teammates help me win? People who were on my team at least 2 times.", srcTag("faceit", "FACEIT · " + fsum))}
  <div class="card vs">
    <div><div class="lab">With a friend</div><div class="big hi">${pct(D.friends.with)}</div><div class="lab">${D.friends.with_games} games</div></div>
    <div class="x">VS</div>
    <div><div class="lab">Only strangers</div><div class="big">${pct(D.friends.without)}</div><div class="lab">${D.friends.without_games} games</div></div>
  </div>
  <div class="cards c3">${D.squad.length ? D.squad.map((m, i) => `
    <div class="card"><div class="rank">#${i + 1}</div>
      <div class="sq-av">${esc(m.name.slice(0, 1).toUpperCase())}</div>
      <h3>${esc(m.name)}</h3><p>${m.games} games together · my K/D ${f2(m.kd)}</p>
      ${bar(m.win_rate, `${Math.round(m.win_rate * m.games)} / ${m.games}`)}
    </div>`).join("") : `<div class="card"><p class="empty">No repeat teammates in these matches yet.</p></div>`}</div>`;

const wins = D.recent.filter(r => r.won).slice(0, 5);
const ringC = 2 * Math.PI * 62;
const progressPage = `${pageHead("Progress", "Track your stats, see your growth, and keep the momentum.", srcTag("faceit", "FACEIT · " + fsum))}
  <div class="cards c3">
    <div class="card center top-faceit"><h4>Level ${p.level ?? "?"} progress ${srcTag("faceit", "FACEIT")}</h4>
      <div class="ring"><svg viewBox="0 0 150 150" width="150" height="150">
        <circle cx="75" cy="75" r="62" fill="none" stroke="${C.s3}" stroke-width="12"/>
        <circle class="fg" cx="75" cy="75" r="62" fill="none" stroke="${C.faceit}" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="${ringC}" stroke-dashoffset="${ringC}" data-off="${ringC * (1 - (p.progress || 0))}"/></svg>
        <div class="rv">${Math.round((p.progress || 0) * 100)}%</div></div>
      <p>${p.to_next != null ? `<b>${p.to_next} Elo</b> to level ${p.level + 1}` : "Max level reached!"}</p></div>
    <div class="card center"><h4>Current streak</h4>
      <div class="streak">
        <svg class="flame" viewBox="0 0 60 70" aria-hidden="true"><path d="M30 2c4 14 20 20 20 40a20 20 0 0 1-40 0c0-10 6-16 10-22 0 8 4 12 8 12 0-12-2-20 2-30z" fill="${s.streak_win ? C.violet : C.s3}"/>
          <path d="M30 40c2 6 9 8 9 16a9 9 0 0 1-18 0c0-6 5-8 9-16z" fill="${s.streak_win ? C.magenta : C.muted}" opacity="${s.streak_win ? .9 : .35}"/></svg>
        <div class="sv">${s.streak} ${s.streak_win ? (s.streak > 1 ? "wins" : "win") : (s.streak > 1 ? "losses" : "loss")}</div>
      </div>
      <div class="hr">${s.streak_win ? "Keep it up!" : "Take a short break, then go again."}</div></div>
    <div class="card"><h4>Recent wins</h4><ul class="checks">${wins.length ? wins.map(w => `<li>${check}Won on ${esc(w.map)} · ${f0(w.kills)} kills<small>${esc(w.date)}</small></li>`).join("") : "<li>No wins in the last 20 games yet.</li>"}</ul></div>
  </div>
  <div class="cards c2">
    <div class="card"><h4>When do I win?</h4><p>Dutch time. Brighter violet = I win more. The small number is how many games.</p><div class="heat" id="heat"></div></div>
    <div class="card"><h4>K/D by hour</h4><p>Do I play worse late at night?</p><div class="chart"><canvas id="hourChart"></canvas></div></div>
  </div>`;

const highlightsPage = `${pageHead("Highlights", "My own moments from the game.")}
  <div class="cards c2">${D.shots.length ? D.shots.map(x => `<div class="card shot"><img src="${x.src}" alt=""><p>${esc(x.caption)}</p></div>`).join("")
    : `<div class="card"><p class="empty">No screenshots yet. Send them to Claude and they'll appear here!</p></div>`}</div>`;

/* ---------- Leetify page: values exactly as Leetify returns them ---------- */
function leetifyPage() {
  const head = pageHead("Leetify", "Premier and matchmaking data, shown exactly as Leetify returns it. Separate from FACEIT.", srcTag("leetify", "Data provided by Leetify"));
  if (!L) return `${head}<div class="card top-leetify"><p class="empty">Leetify is turned off. Set <b>LEETIFY_ENABLED = "true"</b> in the app's Secrets to show it.</p></div>`;
  const c = L.check || {}, pr = L.profile;
  const checkCard = `<details class="card"><summary>Connection details</summary><ul class="chk">
      <li>Status <b>${esc(L.message || L.status)}</b></li>
      <li>Steam ID found <b>${L.steam_id ? `${esc(L.steam_id)} <span class="na">(${esc(L.steam_id_from)})</span>` : `<span class="no">No</span>`}</b></li>
      <li>API key set ${yn(c.key_set)}</li>
      <li>API key accepted ${yn(c.key_valid)}</li>
      <li>Profile found ${yn(c.profile_found)}</li>
      <li>Premier rank returned ${yn(c.premier_found)}</li>
      <li>Competitive map ranks returned <b>${c.competitive_ranks ?? 0}</b></li>
      <li>Matches returned <b>${c.matches ?? 0}</b></li>
      <li>Profile fields <code>${esc((c.profile_fields || []).join(", ") || "none")}</code></li>
      <li>Rank fields <code>${esc((c.rank_fields || []).join(", ") || "none")}</code></li>
      <li>Match fields <code>${esc((c.match_fields || []).join(", ") || "none")}</code></li>
    </ul>${L.matches_message ? `<p class="na" style="margin-top:10px">${esc(L.matches_message)}</p>` : ""}</details>`;
  if (!pr) return `${head}<div class="cards c2"><div class="card top-leetify"><p>${esc(L.message)}</p><div style="margin-top:12px">${ltBadge(true)}</div><p style="margin-top:12px">${ltView()}</p></div>${checkCard}</div>`;
  const r = pr.ranks || {};
  const otherRanks = Object.keys(r);  // includes Premier, as before
  const ranksCard = `<div class="card top-leetify"><h4>Ranks</h4><div class="kv">${otherRanks.map(k => `<span>${title(k)}</span><b>${raw(r[k])}</b>`).join("") || `<span class="na">None returned</span><b></b>`}</div></div>`;
  const compCard = `<div class="card top-leetify"><h4>Competitive ranks per map</h4><div class="kv">${pr.competitive.length ? pr.competitive.map(m =>
      m && m.map_name !== undefined ? `<span>${esc(m.map_name)}</span><b>${raw(m.rank)}</b>` : `<span>Rank</span><b>${raw(m)}</b>`).join("")
      : `<span class="na">Not available from Leetify</span><b></b>`}</div></div>`;
  const ratingCard = `<div class="card top-leetify"><h4>Rating</h4><div class="kv">${Object.keys(pr.rating).map(k => `<span>${title(k)}</span><b>${raw(pr.rating[k])}</b>`).join("") || `<span class="na">Not available from Leetify</span><b></b>`}</div></div>`;
  const overview = `<div class="card top-leetify"><h4>Profile</h4><div class="kv">
      <span>Name</span><b>${raw(pr.name)}</b><span>Total matches</span><b>${raw(pr.total_matches)}</b>
      <span>Winrate</span><b>${raw(pr.winrate)}</b><span>First match date</span><b>${raw(pr.first_match_date)}</b>
      <span>Privacy mode</span><b>${raw(pr.privacy_mode)}</b></div></div>`;
  const rows = (L.matches || []).map(m => `<tr><td>${raw(m.finished_at)}</td><td>${raw(m.map_name)}</td><td>${raw(m.data_source)}</td>
      <td>${raw((m.team_scores || []).join(" : "))}</td><td>${raw(m.total_kills)}</td><td>${raw(m.total_deaths)}</td><td>${raw(m.kd_ratio)}</td><td>${raw(m.leetify_rating)}</td></tr>`).join("");
  const matchCard = `<div class="card tbl top-leetify"><h4>Recent matches</h4>
      ${rows ? `<table><thead><tr><th>Finished at</th><th>Map</th><th>Data source</th><th>Score</th><th>Kills</th><th>Deaths</th><th>K/D ratio</th><th>Leetify rating</th></tr></thead><tbody>${rows}</tbody></table>` : `<p class="na">${esc(L.matches_message || "No matches returned by Leetify.")}</p>`}</div>`;
  return `${head}
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">${ltBadge(true)}
      <p>Leetify data is fetched fresh on every visit and is not stored by this app. ${ltView()}</p></div>
    <div class="cards c3">${overview}${ratingCard}${ranksCard}</div>
    <div class="cards c2">${compCard}${checkCard}</div>
    ${matchCard}`;
}

/* ---------- Premier page: Premier is kept apart from FACEIT and from Competitive ---------- */
function premierPage() {
  const head = pageHead("Premier", "CS2 Premier, kept separate from FACEIT and from Competitive map ranks.", srcTag("premier", "Premier · via Leetify"));
  if (!LT_OK) return `${head}<div class="card top-premier"><p class="empty">${L ? esc(L.message || "Leetify not available") : "Premier data comes through Leetify, which is turned off."} There is no official Premier API, so this page needs Leetify.</p></div>`;
  const prem = (L.profile.ranks || {}).premier;
  const counts = {};
  (L.matches || []).forEach(m => { const k = m.data_source ?? "not given"; counts[k] = (counts[k] || 0) + 1; });
  const srcRows = Object.keys(counts).map(k => `<span>${esc(k)}</span><b>${counts[k]}</b>`).join("");
  return `${head}
    <div class="cards c2">
      <div class="card top-premier"><h4>Premier rating ${srcTag("leetify", "Leetify")}</h4>
        ${prem != null ? `<div class="big-v">${raw(prem)}</div><p class="caption">As returned by Leetify.</p>` : `<p class="empty" style="margin-top:10px">Leetify did not return a Premier rating for this profile.</p>`}
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap">${ltBadge(false)}${ltView()}</div></div>
      <div class="card top-premier"><h4>Premier matches</h4>
        <p>Leetify labels each match with a data source. Premier match stats are only shown once Leetify marks matches as Premier. Until then, here is what it sent:</p>
        <div class="kv">${srcRows || `<span class="na">No matches returned</span><b></b>`}</div></div>
    </div>`;
}

/* ---------- Steam page: only what Steam actually returns ---------- */
function steamPage() {
  const head = pageHead("Steam", "Steam profile and CS2 playtime, straight from the Steam Web API.", srcTag("steam", "Steam"));
  const needs = `<div class="card"><h4>What is needed</h4><ul class="checks">
      <li>A Steam Web API key saved as STEAM_API_KEY in the app's Secrets</li>
      <li>"Game details" set to Public in Steam privacy settings</li>
      <li>Optional: STEAM_ID in Secrets (otherwise the Steam ID from FACEIT is used)</li></ul></div>`;
  if (!ST) return `${head}<div class="cards c2">
    <div class="card top-steam"><h4>Status</h4>
      <div class="kv"><span>Steam ID (from FACEIT)</span><b>${p.steam_id64 ? esc(p.steam_id64) : `<span class="na">Not available</span>`}</b>
        <span>Steam Web API</span><b><span class="na">Not connected</span></b><span>CS2 playtime</span><b><span class="na">Not available</span></b></div>
      ${steamUrl ? `<p style="margin-top:12px"><a class="btn ghost" href="${esc(steamUrl)}" target="_blank" rel="noopener">Open Steam profile ↗</a></p>` : ""}</div>${needs}</div>`;
  const details = `<details class="card"><summary>Connection details</summary><ul class="chk">
      <li>Status <b>${esc(ST.message || ST.status)}</b></li>
      <li>Steam ID <b>${ST.steam_id ? `${esc(ST.steam_id)} <span class="na">(${esc(ST.steam_id_from)})</span>` : `<span class="no">No</span>`}</b></li>
      <li>Profile found ${yn(ST_OK)}</li>
      <li>Game details public ${yn(ST.games_visible)}</li>
      <li>CS2 in library ${yn(ST.cs2 ? ST.cs2.found : null)}</li>
    </ul>${ST.games_message ? `<p class="na" style="margin-top:10px">${esc(ST.games_message)}</p>` : ""}</details>`;
  if (!ST_OK) return `${head}<div class="cards c2"><div class="card top-steam"><h4>Status</h4><p>${esc(ST.message)}</p></div>${details}</div>${needs}`;
  const pr = ST.profile, c = ST.cs2 || {};
  const since = isNum(pr.created) ? new Date(pr.created * 1000).toLocaleDateString("en-GB", { year: "numeric", month: "short" }) : null;
  const profileCard = `<div class="card top-steam"><h4>Profile ${srcTag("steam", "Steam")}</h4>
      <div style="display:flex;gap:14px;align-items:center;margin-top:8px">
        ${pr.avatar ? `<img src="${esc(pr.avatar)}" alt="" style="width:56px;height:56px;border-radius:12px">` : ""}
        <div><div style="font:600 18px var(--f-head);color:var(--text)">${esc(pr.name || "–")}</div>
          <a class="caption" href="${esc(pr.url)}" target="_blank" rel="noopener">Open Steam profile ↗</a></div></div>
      <div class="kv"><span>Profile</span><b>${pr.public ? "Public" : "Private"}</b>
        ${pr.country ? `<span>Country</span><b>${esc(pr.country)}</b>` : ""}
        ${since ? `<span>Steam account since</span><b>${esc(since)}</b>` : ""}</div></div>`;
  const playCard = `<div class="card top-steam"><h4>CS2 playtime ${srcTag("steam", "Steam")}</h4>
      ${c.found ? `<div class="big-v">${hrs(c.hours_total)}</div><p class="caption">Total CS2 playtime</p>
        <div class="kv"><span>Last 2 weeks</span><b>${hrs(c.hours_2weeks)}</b></div>
        <p class="caption" style="margin-top:10px">Steam reports minutes (${esc(c.minutes_total)} total, ${esc(c.minutes_2weeks)} last 2 weeks); shown here in hours.</p>`
        : `<p class="empty" style="margin-top:10px">${esc(ST.games_message || "Steam sent no CS2 playtime.")}</p>`}</div>`;
  return `${head}<div class="cards c2">${profileCard}${playCard}</div>${details}`;
}

/* =================================================================

const ltChip = !L ? `<span class="chip off">${dot("muted")}Leetify off</span>`
  : LT_OK ? `<span class="chip">${dot("leetify")}Leetify live</span>` : `<span class="chip off">${dot("loss")}Leetify unavailable</span>`;
const stChip = !ST ? `<span class="chip off">${dot("muted")}Steam not connected</span>`
  : ST_OK ? `<span class="chip">${dot("steam")}Steam live</span>` : `<span class="chip off">${dot("loss")}Steam unavailable</span>`;
const pagesHtml = { profile: profilePage(), briefing, matches: matchesPage, maps: mapsPage, progress: progressPage, squad: squadPage,
  leetify: leetifyPage(), premier: premierPage(), steam: steamPage(), highlights: highlightsPage };

$("#app").innerHTML = `<div class="app">
  <aside class="side" aria-label="Main navigation">
    <div class="brand"><span class="mk">${icon("cross", "").replace('stroke="currentColor"', 'stroke="#fff"').replace("<svg ", '<svg width="16" height="16" ')}</span><span>CS Stats <em>Coach</em></span></div>
    ${NAV.map(([g, items]) => `<div class="grp">${g}</div>` + items.map(([id, t, src]) =>

    <footer>CS Stats Coach · FACEIT data from the FACEIT Data API${L ? " · Leetify data: Data Provided by Leetify" : ""}${ST ? " · Steam data from the Steam Web API" : ""} · loaded ${esc(D.loaded)}</footer>
  </div></div>`;

/* heatmap */
(function () {
  let h = `<div></div>` + D.heat.cols.map(c => `<div class="h">${c}</div>`).join("");
  D.heat.rows.forEach(r => {
    h += `<div class="d">${r.day}</div>`;
    r.cells.forEach(c => {
      if (!c.games) { h += `<div class="cell" style="background:${C.s2};color:${C.muted}">·</div>`; return; }
      const a = 0.12 + 0.88 * c.win_rate;
      h += `<div class="cell" style="background:rgba(139,92,246,${a});color:${C.text}">${Math.round(c.win_rate * 100)}%<small>${c.games} g</small></div>`;
    });
  });
  $("#heat").innerHTML = h;
})();

/* ---------- animations (skipped when reduced motion is on) ---------- */
const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function animate(root) {
  root.querySelectorAll("[data-count]").forEach(el => {
    const target = parseFloat(el.dataset.count), dec = +el.dataset.dec, unit = el.dataset.unit || "";
    if (isNaN(target)) return;
    if (still) { el.textContent = target.toFixed(dec) + unit; return; }
    const t0 = performance.now();
    (function tick(now) {
      const k = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - k, 3);
      el.textContent = (target * e).toFixed(dec) + unit;
      if (k < 1) requestAnimationFrame(tick);
    })(t0);
  });
  setTimeout(() => {
    root.querySelectorAll(".prog .bar i, .meter i").forEach(b => b.style.width = (b.dataset.w * 100) + "%");
    root.querySelectorAll("circle.fg").forEach(c => c.style.strokeDashoffset = c.dataset.off);
  }, 60);
}

/* ---------- charts: one shared theme ---------- */
const grid = { color: "rgba(255,255,255,0.05)", drawTicks: false };
const axis = extra => Object.assign({ grid, border: { display: false }, ticks: { padding: 8 } }, extra || {});
function theme() {
  Chart.defaults.color = C.muted;
  Chart.defaults.font.family = "Inter, 'Segoe UI', system-ui, sans-serif";
  Chart.defaults.font.size = 11;
  Chart.defaults.plugins.legend.labels.boxWidth = 10;
  Chart.defaults.plugins.legend.labels.boxHeight = 10;
  Chart.defaults.plugins.tooltip.backgroundColor = C.s3;
  Chart.defaults.plugins.tooltip.titleColor = C.text;
  Chart.defaults.plugins.tooltip.bodyColor = C.text2;
  Chart.defaults.plugins.tooltip.padding = 10;
  Chart.defaults.plugins.tooltip.cornerRadius = 8;
  Chart.defaults.animation.duration = still ? 0 : 500;
}
const rolling = (arr, n = 10, min = 1) => arr.map((_, i) => {
  const w = arr.slice(Math.max(0, i - n + 1), i + 1).filter(isNum);
  return w.length >= min ? w.reduce((a, b) => a + b, 0) / w.length : null;
});

let trendChart = null;
const METRICS = {
  kd: { label: "K/D", get: x => x.kd, fmt: f2, ref: 1, cap: "K/D per match (dots: green won, red lost) and the average of the last 10 matches. The faint line is K/D 1.0." },
  wr: { label: "Win rate", get: x => x.won ? 100 : 0, fmt: v => f0(v) + "%", onlyAvg: true, ref: 50, cap: "Win rate over the last 10 matches at each point, starting from match 5 (calculated from your FACEIT results). The faint line is 50%." },
  adr: { label: "ADR", get: x => x.adr, fmt: f0, cap: "Average damage per round per match, and the average of the last 10 matches." },
  hs: { label: "HS%", get: x => x.hs, fmt: v => f0(v) + "%", cap: "Headshot % per match, and the average of the last 10 matches." },
};
function drawTrend(key) {
  const m = METRICS[key], T = D.trend || [];
  const vals = T.map(x => { const v = m.get(x); return isNum(v) ? v : null; });
  const avg = rolling(vals, 10, m.onlyAvg ? 5 : 1);
  const ds = [];
  if (!m.onlyAvg) ds.push({ label: m.label + " per match", data: vals, borderColor: C["violet-deep"], borderWidth: 1.5, tension: .25, spanGaps: true,
    pointRadius: 2.5, pointHoverRadius: 5, pointBackgroundColor: T.map(x => x.won ? C.win : C.loss), pointBorderWidth: 0 });
  ds.push({ label: "Average of last 10", data: avg, borderColor: C["violet-hi"], borderWidth: 2.2, borderDash: m.onlyAvg ? [] : [6, 4], pointRadius: 0, tension: .35,
    fill: m.onlyAvg, backgroundColor: "rgba(139,92,246,.12)" });
  if (m.ref != null) ds.push({ label: "ref", data: T.map(() => m.ref), borderColor: "rgba(255,255,255,.18)", borderWidth: 1, pointRadius: 0, borderDash: [2, 4] });
  if (trendChart) trendChart.destroy();
  trendChart = new Chart($("#trendChart"), { type: "line", data: { labels: T.map(x => x.n), datasets: ds },
    options: { maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false }, tooltip: { filter: i => i.dataset.label !== "ref",
        callbacks: { title: i => `Match ${T[i[0].dataIndex].n} · ${T[i[0].dataIndex].map} · ${T[i[0].dataIndex].won ? "won" : "lost"}`,
          label: c => `${c.dataset.label}: ${c.raw == null ? "–" : m.fmt(c.raw)}` } } },
      scales: { x: axis({ grid: { display: false }, ticks: { maxTicksLimit: 8, padding: 6 }, title: { display: true, text: "Match (oldest → newest)" } }),
        y: axis({ ticks: { maxTicksLimit: 5, padding: 8 } }) } } });
  $("#trendCap").textContent = m.cap;
}

const made = {};
function charts(id) {
  if (!window.Chart || made[id]) return;
  made[id] = true;
  theme();
  if (id === "profile") {
    drawTrend("kd");
    document.querySelectorAll("#trendSeg button").forEach(b => b.addEventListener("click", () => {
      document.querySelectorAll("#trendSeg button").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", x === b); });
      drawTrend(b.dataset.m);
    }));
    if ($("#radarChart")) {
      const rt = L.profile.rating;
      new Chart($("#radarChart"), { type: "radar", data: { labels: ["Aim", "Positioning", "Utility"],
        datasets: [{ label: "Leetify", data: [rt.aim, rt.positioning, rt.utility], borderColor: C.leetify, borderWidth: 2,
          backgroundColor: "rgba(248,73,130,.16)", pointBackgroundColor: C.leetify, pointRadius: 3 }] },
        options: { maintainAspectRatio: false, plugins: { legend: { display: false } },
          scales: { r: { suggestedMin: 0, suggestedMax: 100, angleLines: { color: C.line }, grid: { color: C.line },
            ticks: { display: false, stepSize: 25 }, pointLabels: { color: C.text2, font: { size: 12 } } } } } });
    }
  }
  if (id === "matches") {
    new Chart($("#kdChart"), { type: "line", data: { labels: D.kd.map(x => x.n), datasets: [
      { label: "K/D per match", data: D.kd.map(x => x.kd), borderColor: C["violet-deep"], borderWidth: 1.5, tension: .25,
        pointRadius: 3, pointBackgroundColor: D.kd.map(x => x.won ? C.win : C.loss), pointBorderWidth: 0 },
      { label: "Average of last 10", data: D.kd.map(x => x.avg10), borderColor: C["violet-hi"], borderWidth: 2.5, borderDash: [6, 4], pointRadius: 0, tension: .4 },
      { label: "K/D = 1", data: D.kd.map(() => 1), borderColor: "rgba(255,255,255,.2)", borderDash: [2, 4], borderWidth: 1, pointRadius: 0 },
    ]}, options: { maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { tooltip: { callbacks: { title: i => `Match ${D.kd[i[0].dataIndex].n} · ${D.kd[i[0].dataIndex].map}` } } },
      scales: { x: axis({ grid: { display: false }, ticks: { maxTicksLimit: 10 }, title: { display: true, text: "Match (oldest → newest)" } }), y: axis() } } });
  }
  if (id === "maps") {
    new Chart($("#scatter"), { type: "scatter", data: { datasets: [
      { label: "Won", data: D.points.filter(x => x.won).map(x => ({ x: x.hs, y: x.kd })), backgroundColor: C.win, pointRadius: 4 },
      { label: "Lost", data: D.points.filter(x => !x.won).map(x => ({ x: x.hs, y: x.kd })), backgroundColor: C.loss, pointRadius: 4 },
    ]}, options: { maintainAspectRatio: false, scales: { x: axis({ title: { display: true, text: "Headshot %" } }), y: axis({ title: { display: true, text: "K/D" } }) } } });
    new Chart($("#hsMap"), { type: "bar", data: { labels: D.maps.map(m => m.map), datasets: [{ data: D.maps.map(m => m.hs),
      backgroundColor: D.maps.map(m => m.hs >= s.hs ? C.violet : C["violet-deep"] + "88"), borderRadius: 4, barThickness: 14 }] },
      options: { indexAxis: "y", maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: axis(), y: axis({ grid: { display: false } }) } } });
  }
  if (id === "progress") {
    new Chart($("#hourChart"), { type: "bar", data: { labels: D.hours.map(x => x.hour + ":00"), datasets: [{ data: D.hours.map(x => x.kd),
      backgroundColor: D.hours.map(x => x.kd >= 1 ? C.violet : C["violet-deep"] + "88"), borderRadius: 4 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => `K/D ${c.raw.toFixed(2)} · ${D.hours[c.dataIndex].games} games` } } },
        scales: { y: axis(), x: axis({ grid: { display: false } }) } } });
  }
}

/* ---------- navigation ---------- */
function go(id) {
  if (!document.getElementById(id)) return;
  document.querySelectorAll(".nav").forEach(b => b.classList.toggle("on", b.dataset.go === id));
  document.querySelectorAll(".page").forEach(pg => pg.classList.toggle("on", pg.id === id));
  $("#pageTitle").textContent = TITLES[id] || id;
  const pg = document.getElementById(id); charts(id); animate(pg);
  if (window.Chart) pg.querySelectorAll("canvas").forEach(c => { const ch = Chart.getChart(c); if (ch) ch.resize(); });
  window.scrollTo({ top: 0, behavior: still ? "auto" : "smooth" });
}
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
charts("profile");
animate(document.getElementById("profile"));
</script>
